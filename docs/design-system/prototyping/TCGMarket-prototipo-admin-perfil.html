<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>TCGMarket • Protótipo da Área Administrativa e do Perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p1:#660366;--p1-deep:#4f024f;--p2:#996699;--p3:#C8A2C8;--p-soft:#f0e3f0;--p-softer:#faf5fa;--n0:#fff;--n50:#fafbfe;--n100:#f4f4fd;--n200:#e6e7f0;--n300:#d1d3de;--n500:#74788a;--n700:#484b5a;--n900:#302b40;--red:#b91c1c;--red-bg:#fdecec;--green:#15803d;--green-bg:#e7f6ec;--amber:#a16207;--amber-bg:#fdf6e3;--info:#1d4ed8;--info-bg:#e8f0fe;--orange:#d97706;--display:'Cinzel',Georgia,serif;--sans:'Plus Jakarta Sans',Arial,sans-serif;--radius:12px;--shadow:0 1px 2px #302b400d,0 4px 14px #302b400a}
*{box-sizing:border-box}
html,body{margin:0;font-family:var(--sans);color:var(--n900);background:var(--n50);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--p1)}
:focus-visible{outline:3px solid #b16acc;outline-offset:2px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Navbar */
.topbar{background:linear-gradient(90deg,#4f024f,#660366 55%,#7a1a7a);color:#fff}
.topbar-in{max-width:1280px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.5px;color:#fff;text-decoration:none;white-space:nowrap}
.brand img{width:34px;height:34px}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:9px 12px;color:var(--n500)}
.search span{font-size:13px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:16px}
.btn-ghost-light{display:flex;align-items:center;gap:8px;border:1px solid #ffffff66;background:transparent;color:#fff;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px}
.avatar-btn{display:flex;align-items:center;gap:8px;background:transparent;border:0;color:#fff}
.gamebar{background:#fff;border-bottom:1px solid var(--n200)}
.gamebar-in{max-width:1280px;margin:0 auto;display:flex;justify-content:center;gap:8px}
.gamebar a{display:flex;align-items:center;gap:6px;padding:12px 16px;font-weight:600;font-size:13px;color:var(--n700);text-decoration:none;border-bottom:2px solid transparent}
.gamebar a.soon{color:var(--n500)}
.gamebar a small{font-size:10px;background:var(--n100);border-radius:999px;padding:1px 6px;color:var(--n500)}

/* Layout */
.wrap{max-width:1280px;margin:0 auto;padding:16px 24px 40px}
.crumb{display:flex;align-items:center;gap:6px;color:var(--n500);font-size:12px;margin-bottom:12px}
.crumb a{color:var(--p1);text-decoration:none;font-weight:600}
.card{background:#fff;border:1px solid var(--n200);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-head h2,.card-head h3{margin:0;font-size:15px;font-weight:700}
.link{font-size:12px;font-weight:700;color:var(--p1);text-decoration:none;display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:0}
h1.display{font-family:var(--display);color:var(--p1);margin:0;font-size:30px;line-height:1.2}
.muted{color:var(--n500)}
.row{display:flex;gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}

/* Buttons */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;border:1px solid transparent;transition:background .15s,border .15s}
.btn-primary{background:var(--p1);color:#fff}.btn-primary:hover{background:var(--p1-deep)}
.btn-secondary{background:var(--p-soft);color:var(--p1)}
.btn-outline{background:#fff;border-color:var(--p3);color:var(--p1)}.btn-outline:hover{background:var(--p-softer)}
.btn-ghost{background:transparent;color:var(--n700)}.btn-ghost:hover{background:var(--n100)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger-outline{background:#fff;border-color:#f1b8b8;color:var(--red)}
.btn[disabled],.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.spinner{width:14px;height:14px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.b-green{background:var(--green-bg);color:var(--green)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-purple{background:var(--p1);color:#fff}
.b-soft{background:var(--p-soft);color:var(--p1)}
.b-neutral{background:var(--n100);color:var(--n700)}
.b-info{background:var(--info-bg);color:var(--info)}

/* Avatar */
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--p3);color:var(--p1-deep);font-weight:700;flex:none}
.av-xl{width:112px;height:112px;font-size:38px;border:4px solid #fff;box-shadow:0 6px 20px #66036633;background:linear-gradient(135deg,#C8A2C8,#996699);color:#fff;font-family:var(--display)}
.av-md{width:36px;height:36px;font-size:13px}
.av-sm{width:30px;height:30px;font-size:11px}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:var(--radius);background:linear-gradient(110deg,#fff 0%,#fbf6fb 42%,#e9d4ea 100%);border:1px solid var(--n200);padding:24px 28px;display:flex;align-items:center;gap:24px;margin-bottom:16px}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:420px;height:260px;background:radial-gradient(circle at 70% 40%,#c8a2c855,transparent 60%),radial-gradient(circle at 30% 80%,#99669933,transparent 55%);pointer-events:none}
.hero .deco{position:absolute;right:40px;top:50%;transform:translateY(-50%);display:flex;gap:10px;opacity:.55;pointer-events:none}
.hero .deco span{width:58px;height:82px;border-radius:8px;border:2px solid #fff;background:linear-gradient(160deg,#996699,#660366);box-shadow:0 6px 16px #66036640}
.hero .deco span:nth-child(1){transform:rotate(-12deg) translateY(8px)}.hero .deco span:nth-child(2){transform:translateY(-6px)}.hero .deco span:nth-child(3){transform:rotate(12deg) translateY(8px)}
.hero-body{position:relative;z-index:1;flex:1;min-width:0}
.hero-actions{position:relative;z-index:2;align-self:flex-start}
.hero h1{margin:0;font-family:var(--display);color:var(--p1);font-size:28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:6px;color:var(--n700);font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--p3);background:#fff;color:var(--p1);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}

/* Profile body */
.profile-grid{display:grid;grid-template-columns:1fr 340px;gap:16px}
.tcg-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tcg-tile{border:1px solid var(--n200);border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:13px}
.tcg-tile.on{background:var(--p1);color:#fff;border-color:var(--p1)}
.tcg-tile.off{color:var(--n500);background:var(--n50)}
.tcg-tile .gi{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#ffffff26;border:2px solid currentColor;font-family:var(--display);font-size:13px}
.info-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.info-list li{display:flex;align-items:center;gap:10px;color:var(--n700);font-size:13px}
.info-list li svg{color:var(--p2)}
.soon-box{border:1.5px dashed var(--p3);border-radius:10px;background:var(--p-softer);padding:22px;text-align:center;color:var(--n700)}
.soon-box strong{display:block;color:var(--p1);margin-bottom:4px}
.fake-cards{display:flex;justify-content:center;gap:8px;margin-bottom:10px;opacity:.35}
.fake-cards span{width:34px;height:48px;border-radius:5px;background:linear-gradient(160deg,#996699,#660366)}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label,.field .lbl{font-weight:700;font-size:13px}
.field .req{color:var(--red)}
.input,.select,.textarea{border:1px solid var(--n300);border-radius:10px;padding:10px 12px;background:#fff;width:100%}
.textarea{min-height:92px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:var(--p2);outline:3px solid #c8a2c855;outline-offset:0}
.input-group{display:flex;align-items:stretch}
.input-group .prefix{border:1px solid var(--n300);border-right:0;border-radius:10px 0 0 10px;padding:10px 12px;background:var(--n100);color:var(--n500);font-weight:700}
.input-group .input{border-radius:0 10px 10px 0}
.help{font-size:12px;color:var(--n500);display:flex;justify-content:space-between;gap:8px}
.field.invalid .input,.field.invalid .textarea{border-color:var(--red);background:#fffafa}
.field.invalid .prefix{border-color:var(--red)}
.err{font-size:12px;color:var(--red);font-weight:600;display:flex;align-items:center;gap:6px}
.readonly{background:var(--n100);border:1px solid var(--n200);border-radius:10px;padding:10px 12px;color:var(--n700);display:flex;align-items:center;justify-content:space-between;gap:8px}
.check-chips{display:flex;gap:8px;flex-wrap:wrap}
.check-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--n300);border-radius:10px;padding:9px 14px;font-weight:600;background:#fff}
.check-chip.on{border-color:var(--p1);background:var(--p-soft);color:var(--p1)}
.check-chip .box{width:16px;height:16px;border-radius:4px;border:2px solid currentColor;display:flex;align-items:center;justify-content:center}
.check-chip.on .box{background:var(--p1);border-color:var(--p1);color:#fff}
.section-title{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--p2);margin:4px 0 0;grid-column:1/-1;padding-top:8px;border-top:1px solid var(--n200)}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--n200)}
.avatar-edit{display:flex;align-items:center;gap:18px}

/* Alerts */
.alert{display:flex;gap:12px;align-items:flex-start;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:16px;border:1px solid}
.alert strong{display:block}
.alert-success{background:var(--green-bg);border-color:#b7e3c4;color:#14532d}
.alert-error{background:var(--red-bg);border-color:#f5c2c2;color:#7f1d1d}
.alert-info{background:var(--info-bg);border-color:#c3d4fb;color:#1e3a8a}
.alert-warn{background:var(--amber-bg);border-color:#f1dca4;color:#713f12}

/* Admin */
.admin-hero{background:linear-gradient(110deg,#fff 0%,#fbf6fb 45%,#e9d4ea 100%)}
.admin-hero .icon-box{width:64px;height:64px;border-radius:14px;background:var(--p-soft);color:var(--p1);display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.admin-hero .icon-box svg{width:32px;height:32px}
.wrap.wide{max-width:1400px}
.admin-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.admin-grid>*,.kpis>*,.dash-main>*,.dash-bottom>*,.detail-grid>*{min-width:0}
.table td.nw,.who b{white-space:nowrap}
.side{padding:10px;position:sticky;top:12px}
.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:var(--n700);text-decoration:none;font-weight:600;font-size:13px}
.side a:hover{background:var(--n100)}
.side a.active{background:var(--p-soft);color:var(--p1)}
.side a.disabled{color:var(--n500);cursor:not-allowed}
.side a.disabled:hover{background:transparent}
.side a .badge{margin-left:auto}
.side hr{border:0;border-top:1px solid var(--n200);margin:8px 4px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{padding:16px;display:flex;gap:12px;align-items:flex-start}
.kpi .ic{width:42px;height:42px;border-radius:10px;background:var(--p-soft);color:var(--p1);display:flex;align-items:center;justify-content:center}
.kpi .lbl{font-size:12px;color:var(--n700);font-weight:600}
.kpi .val{font-size:24px;font-weight:700;line-height:1.2;margin-top:2px}
.kpi .delta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-top:6px}
.kpi .delta.up{background:var(--green-bg);color:var(--green)}
.kpi .delta.flat{background:var(--n100);color:var(--n500)}
.kpi .sub{font-size:11px;color:var(--n500);margin-top:4px}
.kpi.empty .val{font-size:13px;color:var(--n500);font-weight:600;margin-top:6px}
.dash-main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 240px;gap:16px}
.dash-bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 300px;gap:16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--n700)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid}
.seg{display:inline-flex;border:1px solid var(--n300);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 10px;font-size:12px;font-weight:600;color:var(--n700)}
.seg button.on{background:var(--p1);color:#fff}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut-legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:12px;flex:1}
.donut-legend li{display:flex;align-items:center;gap:8px}
.donut-legend li b{margin-left:auto}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{border:1px solid var(--n200);background:#fff;border-radius:10px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--n700);text-align:center}
.quick button svg{color:var(--p1);width:22px;height:22px}
.quick button:hover{border-color:var(--p3);background:var(--p-softer)}
.quick button[disabled]{opacity:.55;cursor:not-allowed}
.quick button[disabled] svg{color:var(--n500)}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--n500);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--n200)}
.table td{padding:10px;border-bottom:1px solid var(--n100);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tr.self td{background:var(--p-softer)}
.who{display:flex;align-items:center;gap:10px}
.who b{display:block;font-size:13px}
.who small{color:var(--n500);font-size:12px}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.feed li{display:flex;gap:10px;align-items:flex-start;font-size:12px}
.feed .fi{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--p-soft);color:var(--p1)}
.feed .fi svg{width:15px;height:15px}
.feed .fi.red{background:var(--red-bg);color:var(--red)}
.feed .fi.amber{background:var(--amber-bg);color:var(--amber)}
.feed b{display:block;font-size:12px}
.feed time{margin-left:auto;color:var(--n500);white-space:nowrap}
.block-empty{border:1.5px dashed var(--n300);border-radius:10px;padding:22px;text-align:center;color:var(--n500);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:150px;justify-content:center}
.block-empty svg{width:26px;height:26px;color:var(--p3)}
.block-error{border:1px solid #f5c2c2;background:#fffafa;border-radius:10px;padding:22px;text-align:center;color:#7f1d1d;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:10px;min-height:220px;justify-content:center}
.block-error svg{width:28px;height:28px;color:var(--red)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .search-in{flex:1;min-width:240px;display:flex;align-items:center;gap:8px;border:1px solid var(--n300);border-radius:10px;padding:0 12px;background:#fff}
.toolbar .search-in input{border:0;outline:0;padding:10px 0;flex:1;background:transparent}
.toolbar .select{width:auto;min-width:150px}
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:12px;color:var(--n500)}
.pager .pages{display:flex;gap:4px}
.pager .pages button{min-width:32px;height:32px;border-radius:8px;border:1px solid var(--n300);background:#fff;font-weight:700;font-size:12px}
.pager .pages button.on{background:var(--p1);color:#fff;border-color:var(--p1)}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--n200);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--n700)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:10px 12px;font-size:13px;margin:0}
.kv dt{color:var(--n500);font-weight:600}
.kv dd{margin:0}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--n200);padding-left:16px;display:flex;flex-direction:column;gap:14px}
.timeline li{position:relative;font-size:13px}
.timeline li::before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--p2);border:2px solid #fff}
.timeline li.red::before{background:var(--red)}
.timeline small{display:block;color:var(--n500)}
.action-bar{display:flex;gap:8px;flex-wrap:wrap}
.tip{font-size:11px;color:var(--n500);display:flex;align-items:center;gap:4px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--n100);border-radius:5px;padding:1px 6px;color:var(--n700)}
.thumb{width:36px;height:50px;border-radius:5px;background:linear-gradient(160deg,#C8A2C8,#996699);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-family:var(--display)}
.thumb.dim{filter:grayscale(1);opacity:.55}

/* Center states */
.center-state{max-width:520px;margin:30px auto;text-align:center;padding:40px 32px}
.center-state .ill{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;background:var(--p-soft);color:var(--p1);display:flex;align-items:center;justify-content:center;position:relative}
.center-state .ill svg{width:44px;height:44px}
.center-state .ill.red{background:var(--red-bg);color:var(--red)}
.center-state h2{font-family:var(--display);color:var(--p1);margin:0 0 8px;font-size:22px}
.center-state p{color:var(--n700);margin:0 0 20px}
.center-state .floating span{position:absolute;width:26px;height:36px;border-radius:5px;background:linear-gradient(160deg,#C8A2C8,#996699);opacity:.35}
.center-state .floating span:nth-child(1){left:-38px;top:10px;transform:rotate(-16deg)}
.center-state .floating span:nth-child(2){right:-36px;top:30px;transform:rotate(14deg)}

/* Skeleton */
.sk{background:linear-gradient(90deg,#eceef5 25%,#f6f7fb 37%,#eceef5 63%);background-size:400% 100%;animation:sh 1.4s ease infinite;border-radius:8px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* Modal */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(48,43,64,.5);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:min(560px,100%);background:#fff;border-radius:14px;box-shadow:0 20px 70px #1b0a306b;overflow:hidden;animation:open .2s ease-out}
@keyframes open{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px;border-bottom:1px solid var(--n200)}
.modal-head h2{margin:0;font-family:var(--display);color:var(--p1);font-size:20px}
.modal-head.danger h2{color:var(--red)}
.modal-head p{margin:4px 0 0;color:var(--n700);font-size:13px}
.modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--n200);background:var(--n50)}
.target{display:flex;align-items:center;gap:12px;background:var(--n50);border:1px solid var(--n200);border-radius:10px;padding:10px 12px}

/* Footer */
footer{background:linear-gradient(90deg,#4f024f,#660366);color:#f0e3f0;margin-top:24px}
.foot-in{max-width:1280px;margin:0 auto;padding:28px 24px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px;font-size:12px}
.foot-in h4{margin:0 0 8px;color:#fff;font-size:13px}
.foot-in p{margin:4px 0}
.foot-in .brand{font-size:18px}

/* Demo bar */
.demo-bar{position:fixed;z-index:40;bottom:14px;left:50%;transform:translateX(-50%);background:#250a30f3;border:1px solid #9e5db2;color:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 12px 38px #24082d60;display:flex;flex-direction:column;gap:6px;max-width:calc(100vw - 20px);font-size:12px;backdrop-filter:blur(9px)}
.demo-bar .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.demo-bar .lab{font-weight:700;padding:0 6px 0 2px;min-width:64px}
.demo-bar button{border:1px solid #9959a2;background:#ffffff12;color:#fff;border-radius:8px;padding:6px 10px;font-size:11.5px;white-space:nowrap}
.demo-bar button:hover,.demo-bar button.sel{background:#84298e;border-color:#cb92d9}
.demo-toggle{position:fixed;z-index:41;right:14px;bottom:14px;border:1px solid #9e5db2;background:#250a30f3;color:#fff;border-radius:10px;padding:8px 12px;font-size:12px}
body.capture .demo-bar,body.capture .demo-toggle{display:none}
body{padding-bottom:110px}
body.capture{padding-bottom:0}

@media (max-width:1100px){.dash-main,.dash-bottom{grid-template-columns:1fr 1fr}.dash-main>:last-child,.dash-bottom>:last-child{grid-column:1/-1}.kpis{grid-template-columns:1fr 1fr}}
@media (max-width:860px){.admin-grid,.profile-grid,.detail-grid,.form-grid{grid-template-columns:1fr}.side{position:static;display:flex;overflow-x:auto;gap:4px}.side hr{display:none}.side a{white-space:nowrap}.hero{flex-direction:column;align-items:flex-start}.hero .deco{display:none}.foot-in{grid-template-columns:1fr 1fr}.search{display:none}.dash-main,.dash-bottom{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function series(seed, base, amp, trend){const r=rnd(seed);return Array.from({length:30},(_,i)=>Math.round(base+trend*i+Math.sin(i/2.3)*amp*0.5+r()*amp))}
const S_USERS = series(7, 70, 40, 1.6), S_ADS = series(11, 50, 34, 1.2), S_SALES = series(23, 15, 18, .5);
const DAYS = Array.from({length:30},(_,i)=>{const d=new Date(2026,9,11);d.setDate(d.getDate()-29+i);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})});

function lineChart(withMarket){
  const W=560,H=210,P={l:34,r:10,t:12,b:26};
  const all = withMarket ? [S_USERS,S_ADS,S_SALES] : [S_USERS];
  const max = Math.ceil(Math.max(...all.flat())/40)*40;
  const x=i=>P.l+i*(W-P.l-P.r)/29, y=v=>H-P.b-v*(H-P.t-P.b)/max;
  const path=s=>s.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const grid=[0,.25,.5,.75,1].map(f=>{const v=Math.round(max*f);return `<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="#e6e7f0"/><text x="${P.l-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#74788a">${v}</text>`}).join('');
  const xl=[0,7,14,21,29].map(i=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#74788a">${DAYS[i]}</text>`).join('');
  const dots=S_USERS.map((v,i)=>i%3===0?`<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="#660366"/>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-labelledby="chart-t chart-d"><title id="chart-t">Atividade nos últimos 30 dias</title><desc id="chart-d">Valores detalhados na tabela a seguir.</desc>${grid}${xl}
    <path d="${path(S_USERS)}" fill="none" stroke="#660366" stroke-width="2.5"/>${dots}
    ${withMarket?`<path d="${path(S_ADS)}" fill="none" stroke="#b06ab3" stroke-width="2.5" stroke-dasharray="7 4"/><path d="${path(S_SALES)}" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="2 4" stroke-linecap="round"/>`:''}
  </svg>
  <div class="sr-only"><table><caption>Atividade diária</caption><thead><tr><th>Dia</th><th>Usuários novos</th>${withMarket?'<th>Anúncios criados</th><th>Vendas</th>':''}</tr></thead><tbody>${DAYS.map((d,i)=>`<tr><td>${d}</td><td>${S_USERS[i]}</td>${withMarket?`<td>${S_ADS[i]}</td><td>${S_SALES[i]}</td>`:''}</tr>`).join('')}</tbody></table></div>`;
}
function donut(){
  const total=GAMES.reduce((a,g)=>a+g.count,0), R=52, C=2*Math.PI*R; let off=0;
  const segs=GAMES.map(g=>{const len=g.count/total*C;const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${g.color}" stroke-width="22" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"/>`;off+=len;return s}).join('');
  return `<div class="donut-wrap"><svg viewBox="0 0 140 140" width="150" role="img" aria-label="Distribuição de ${fmt(total)} cartas por TCG">${segs}<text x="70" y="68" text-anchor="middle" font-size="18" font-weight="700" fill="#302b40">${fmt(total)}</text><text x="70" y="86" text-anchor="middle" font-size="10" fill="#74788a">cartas</text></svg>
  <ul class="donut-legend">${GAMES.map(g=>`<li><span class="sw" style="background:${g.color}"></span>${g.name}<b>${Math.round(g.count/total*100)}%</b></li>`).join('')}<li class="muted" style="font-size:11px">${GAMES.map(g=>`${g.name}: ${fmt(g.count)}`).join(' · ')}</li></ul></div>`;
}
function kpi(icon,label,val,delta,empty){
  if(empty) return `<div class="card kpi empty"><div class="ic">${ic(icon)}</div><div><div class="lbl">${label}</div><div class="val">Disponível quando o marketplace estiver ativo</div></div></div>`;
  return `<div class="card kpi"><div class="ic">${ic(icon)}</div><div><div class="lbl">${label}</div><div class="val">${val}</div>${delta?`<span class="delta up">${ic('arrowUp','style="width:11px;height:11px"')}${delta}</span>`:`<span class="delta flat">—</span>`}<div class="sub">em relação ao mês anterior</div></div></div>`;
}

function screenClean(){
  const opts=[['Bio',true],['Links',true],['Foto do perfil',false],['Cidade/UF',false]];
  return screenUserDetail() + modal({title:'Limpar conteúdo do perfil',desc:'Os campos selecionados voltam ao padrão. Nome e @usuário só podem ser alterados pela própria pessoa.',confirm:'Limpar campos selecionados',confirmIcon:'eraser',
    body: targetUser + `<fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl" style="margin-bottom:8px">Campos a limpar</legend><div class="check-chips">${opts.map(([l,on])=>`<label class="check-chip ${on?'on':''}"><span class="box">${on?ic('check','style="width:12px;height:12px"'):''}</span><input type="checkbox" class="sr-only" ${on?'checked':''}>${l}</label>`).join('')}</div></fieldset>` + reasonField('Ex.: bio com linguagem ofensiva.')});
}
function screenPromote(){
  return screenUserDetail() + modal({title:'Promover a administrador',desc:'A pessoa passa a acessar a Área Administrativa, incluindo a gestão de usuários.',confirm:'Promover',confirmIcon:'crown',
    body: targetUser + `<div class="alert alert-info" style="margin:0">${ic('info')}<div>A alteração vale na próxima requisição e fica registrada no histórico. Ela pode ser revertida a qualquer momento por outro administrador.</div></div>`});
}

function screenCatalog(modalHide=false){
  const rows = CARDS.map(c=>`<tr><td><div class="who"><span class="thumb ${c.hidden?'dim':''}">${c.name[0]}</span><div><b>${c.name}</b><small>${c.set}</small></div></div></td><td>${c.game}</td><td>${c.rarity}</td><td><span class="badge b-info">${c.source}</span><div style="margin-top:4px"><span class="mono" title="${c.ext}">${c.ext.length>14?c.ext.slice(0,13)+'…':c.ext}</span></div></td>
    <td>${c.hidden?'<span class="badge b-amber">'+ic('eyeOff','style="width:11px;height:11px"')+'Oculta</span>':'<span class="badge b-green">Visível</span>'}</td>
    <td style="text-align:right">${c.hidden?`<button class="btn btn-outline btn-sm" type="button">${ic('eye')}Reexibir</button>`:`<a class="btn btn-ghost btn-sm" href="#admin-ocultar">${ic('eyeOff')}Ocultar</a>`}</td></tr>`).join('');
  const inner = `<section class="card card-pad">
    <div class="card-head"><h2>Catálogo</h2><span class="muted" style="font-size:12px">${fmt(12436)} cartas importadas</span></div>
    <div class="alert alert-info">${ic('info')}<div>As cartas vêm das APIs oficiais (Pokémon TCG API, YGOPRODeck e Scryfall) e não são editadas aqui. Você pode ocultar uma carta com dado ou imagem problemáticos.</div></div>
    <div class="toolbar">
      <label class="search-in">${ic('search')}<span class="sr-only">Pesquisar cartas</span><input placeholder="Pesquisar pelo nome da carta"></label>
      <select class="select" aria-label="TCG"><option>Todos os TCGs</option>${GAMES.map(g=>`<option>${g.name}</option>`).join('')}</select>
      <select class="select" aria-label="Coleção"><option>Todas as coleções</option></select>
      <select class="select" aria-label="Raridade"><option>Todas as raridades</option></select>
      <select class="select" aria-label="Visibilidade"><option>Visíveis e ocultas</option><option>Somente ocultas</option></select>
    </div>
    <table class="table"><thead><tr><th>Carta</th><th>TCG</th><th>Raridade</th><th>Origem</th><th>Catálogo público</th><th><span class="sr-only">Ações</span></th></tr></thead><tbody>${rows}</tbody></table>
    <div class="pager"><span>Exibindo 1–7 de ${fmt(12436)} cartas</span><div class="pages"><button type="button" disabled aria-label="Página anterior">‹</button><button class="on" type="button" aria-current="page">1</button><button type="button">2</button><span style="padding:6px">…</span><button type="button">622</button><button type="button" aria-label="Próxima página">›</button></div></div>
  </section>`;
  const base = adminShell('admin-catalogo', inner);
  if(!modalHide) return base;
  return base + `<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div class="modal-head"><div><h2 id="m-title">Ocultar carta do catálogo</h2><p>A carta some do catálogo público, mas continua válida para coleções e anúncios existentes.</p></div><a class="icon-btn" href="#admin-catalogo" aria-label="Fechar">${ic('x')}</a></div>
    <div class="modal-body"><div class="target"><span class="thumb">C</span><div class="who"><div><b>Charizard</b><small>Base Set · Pokémon TCG API · <span class="mono">base1-4</span></small></div></div></div>
    <div class="alert alert-info" style="margin:0">${ic('info')}<div>Os dados importados não são alterados. A ocultação continua valendo mesmo se a carta for importada de novo.</div></div>
    ${reasonField('Ex.: imagem da carta está trocada na API.')}</div>
    <div class="modal-foot"><a class="btn btn-ghost" href="#admin-catalogo">Cancelar</a><button class="btn btn-primary" type="button">${ic('eyeOff')}Ocultar carta</button></div></div></div>`;
}

function screenDenied(){
  const who = {initials:'MC'};
  return page(crumb(['Área administrativa']) + `<section class="card center-state"><div class="ill">${ic('lock')}</div><h2>Acesso restrito</h2><p>Esta área é exclusiva para administradores do TCG Market. Se você acredita que deveria ter acesso, fale com a equipe.</p><div class="action-bar" style="justify-content:center"><a class="btn btn-primary" href="#perfil">Voltar para o início</a><a class="btn btn-ghost" href="#perfil-publico">Ir para meu perfil</a></div></section>`, {admin:false, who});
}

const ROUTES = {
  'perfil': ()=>screenProfile(),
  'perfil-salvo': ()=>screenProfile(true),
  'perfil-editar': ()=>screenEdit(),
  'perfil-editar-erro': ()=>screenEdit('error'),
  'perfil-salvando': ()=>screenEdit('saving'),
  'perfil-publico': screenPublic,
  'perfil-carregando': screenProfileLoading,
  'perfil-nao-encontrado': screenNotFound,
  'perfil-erro': screenProfileError,
  'admin': ()=>screenDashboard('full'),
  'admin-sem-marketplace': ()=>screenDashboard('nomarket'),
  'admin-carregando': ()=>screenDashboard('loading'),
  'admin-erro-bloco': ()=>screenDashboard('error'),
  'admin-usuarios': screenUsers,
  'admin-usuario': screenUserDetail,
  'admin-suspender': screenSuspend,
  'admin-limpar': screenClean,
  'admin-promover': screenPromote,
  'admin-catalogo': ()=>screenCatalog(false),
  'admin-ocultar': ()=>screenCatalog(true),
  'acesso-negado': screenDenied,
};

function render(){
  const params = new URLSearchParams(location.search);
  document.body.classList.toggle('capture', params.has('captura'));
  const key = location.hash.replace('#','') || 'perfil';
  document.getElementById('app').innerHTML = (ROUTES[key] || ROUTES.perfil)();
  document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('sel', b.dataset.go===key));
  if(!document.querySelector('.overlay')) window.scrollTo(0,0);
  if(params.has('captura')) document.fonts.ready.then(()=>{document.documentElement.dataset.altura = document.documentElement.scrollHeight;});
}
document.getElementById('demoBar').addEventListener('click', e=>{const b=e.target.closest('[data-go]'); if(b) location.hash=b.dataset.go;});
document.getElementById('demoToggle').addEventListener('click', e=>{const bar=document.getElementById('demoBar');bar.hidden=!bar.hidden;e.currentTarget.textContent=bar.hidden?'Mostrar estados':'Ocultar estados';});
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
