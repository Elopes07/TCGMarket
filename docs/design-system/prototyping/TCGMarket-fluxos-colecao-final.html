<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light"><title>TCGMarket • Protótipo dos fluxos da coleção</title>
<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--sans);color:var(--neutral-900);background:var(--neutral-50)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.68}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #b16acc;outline-offset:2px}button{transition:background .17s,border .17s,transform .17s}button:not(:disabled):active{transform:translateY(1px)}[hidden]{display:none!important}
/* A própria imagem aprovada da Minha Coleção é o cenário, incorporada no arquivo. */
.page{position:relative;margin:0 auto;max-width:1536px;line-height:0}.page>img{display:block;width:100%;height:auto}.hotspot{position:absolute;border:2px solid transparent;background:transparent;border-radius:9px;opacity:0;transition:opacity .2s,border .2s,background .2s}.hotspot:focus-visible,.hotspot:hover{opacity:1;border-color:#a742c1;background:#be65e422;box-shadow:0 0 0 3px #fff9;outline:none}.hotspot.add{left:83.4%;top:24.1%;width:13%;height:5%}.hotspot.detail{left:23.1%;top:58.7%;width:3.6%;height:5%}.hotspot.edit{left:26.9%;top:58.7%;width:3.6%;height:5%}.hotspot.addtwo{left:29.8%;top:9%;width:3%;height:2.5%;display:none}
.demo-bar{position:fixed;z-index:11;bottom:18px;left:50%;transform:translateX(-50%);background:#250a30f3;border:1px solid #9e5db2;color:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 12px 38px #24082d60;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 20px);font-size:12px;flex-wrap:wrap;justify-content:center;backdrop-filter:blur(9px)}.demo-label{font-weight:700;white-space:nowrap;padding:0 7px 0 3px}.demo-bar button{border:1px solid #9959a2;background:#ffffff12;color:white;border-radius:8px;padding:10px 13px;font-size:12px;white-space:nowrap}.demo-bar button:hover,.demo-bar button.selected{background:#84298e;border-color:#cb92d9}.demo-bar button.error-button{border-color:#dc9ca2;color:#ffd8d8}.hint{position:fixed;left:20px;bottom:23px;background:#fffefa;border:1px solid #ead9ef;color:#5b2162;padding:10px 14px;border-radius:9px;box-shadow:0 4px 15px #15052522;z-index:5;font-size:12px;max-width:255px;line-height:1.5}
.overlay{position:fixed;inset:0;z-index:25;background:rgba(48,43,64,.50);backdrop-filter:blur(2px);padding:12px 16px;display:flex;align-items:center;justify-content:center}.modal{width:min(880px,100%);max-height:calc(100dvh - 24px);background:#fff;border-radius:12px;box-shadow:0 20px 75px #1b0a306b;border:1px solid #e6e7f0;display:flex;flex-direction:column;overflow:hidden;animation:open .21s ease-out;position:relative}@keyframes open{from{opacity:0;transform:translateY(9px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{flex:none;display:flex;align-items:flex-start;justify-content:space-between;padding:23px 24px 24px;background:linear-gradient(120deg,#fff 0%,#fcf9fd 75%);border-bottom:1px solid var(--neutral-200);gap:10px}.modal-head h1{margin:0;font-family:var(--display);text-transform:uppercase;font-weight:700;color:var(--primary);font-size:23px;line-height:1.3;letter-spacing:-.45px}.modal-head p{font-size:13px;color:var(--neutral-700);margin:7px 0 0;line-height:1.5}.modal-close{border:0;background:transparent;font-size:28px;color:var(--primary);padding:0 8px;line-height:1.1;border-radius:7px}.modal-close:hover{background:var(--primary-soft)}.modal-scroll{overflow-y:auto;overscroll-behavior:contain;min-height:0;flex:1;scrollbar-width:thin;scrollbar-color:#b7b7b7 transparent}.modal-foot{flex:none;display:flex;align-items:center;justify-content:flex-end;gap:12px;border-top:1px solid var(--neutral-200);padding:16px 24px;background:#fff}.modal-foot .footleft{margin-right:auto;font-size:11px;color:var(--neutral-500)}
.modal-layout{display:grid;grid-template-columns:276px minmax(0,1fr);gap:24px;padding:24px;align-items:start}.identity{border:1px solid var(--neutral-200);border-radius:12px;padding:12px;background:#fff}.eyebrow{display:flex;align-items:center;gap:8px;font-size:10.5px;color:#3e3557;margin:0 0 15px;line-height:1.3}.info-i{display:inline-grid;place-items:center;border:1.5px solid currentColor;font-size:9px;font-weight:700;width:12px;height:12px;border-radius:50%;font-family:Georgia,serif;flex:none}.card-image{display:block;width:206px;max-width:100%;height:284px;object-fit:fill;margin:0 auto 15px;box-shadow:0 0 0 0 transparent}.identity h2{margin:0 0 6px;font-size:18px;font-weight:700;color:#15132b}.identity .set{font-size:12px;color:#504a67;margin-bottom:12px}.rarity{display:inline-block;border-radius:20px;padding:4px 9px;background:var(--primary-soft);color:#803d80;font-size:11px}.facts{margin-top:16px;border-radius:9px;background:var(--neutral-50);padding:13px 12px;display:grid;grid-template-columns:1fr 1fr;gap:18px 10px;font-size:11px;line-height:1.35}.facts b{display:block;font-weight:700;color:#20152e;margin-bottom:6px}.facts span{color:#565070}
.content-area{min-width:0}.section-heading{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--neutral-200);padding-bottom:14px;margin:0 0 16px;gap:10px}.section-heading h3{font:700 18px var(--display);text-transform:uppercase;color:var(--primary);margin:0;line-height:1.3}.section-heading .label{background:var(--primary-soft);color:#9b4896;padding:4px 9px;border-radius:30px;font-size:10px;white-space:nowrap}.info-box{display:flex;gap:12px;align-items:flex-start;border-radius:8px;background:#e7f0ff;color:var(--info);font-size:11.5px;line-height:1.65;padding:13px 14px;margin-bottom:22px}.info-box .info-i{width:14px;height:14px;margin-top:2px}.field-grid{display:grid;grid-template-columns:140px minmax(0,1fr);gap:20px}.field{margin-bottom:22px;min-width:0}.field label,.field .field-label{display:block;font-size:13px;color:#2e233f;font-weight:700;margin-bottom:10px}.req{color:#c01931}.field input:not([type=checkbox]),.field select,.field textarea{width:100%;background:#fff;border:1px solid var(--neutral-300);border-radius:8px;min-height:41px;padding:11px 14px;font-size:12px;color:#372643;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#8a378b;box-shadow:0 0 0 3px #f0e3f0}.field select{appearance:auto;padding-right:7px}.field .help{font-size:11px;color:#6d587d;margin-top:6px;line-height:1.5}.field textarea{height:87px;resize:vertical;min-height:82px;line-height:1.5}.charcount{text-align:right;color:#58576d;font-size:11px;margin-top:4px}.counter{display:flex;height:41px;border:1px solid var(--neutral-300);border-radius:8px;overflow:hidden}.counter button{border:0;background:#fff;color:#7d2e8a;min-width:36px;font-size:23px;display:grid;place-items:center}.counter button:hover{background:#f8eef9}.counter input{text-align:center;border:0!important;box-shadow:none!important;min-width:0;width:100%;padding:0!important;font-size:12px!important;appearance:textfield}.counter input::-webkit-inner-spin-button,.counter input::-webkit-outer-spin-button{appearance:none;margin:0}.help-link{width:100%;display:flex;align-items:center;gap:11px;text-align:left;background:var(--neutral-100);border:0;border-radius:8px;color:var(--primary);font-size:11px;padding:12px 14px;margin-top:-4px;margin-bottom:22px}.help-link:hover{background:var(--primary-soft)}.guide{border:1px solid #e3d5e6;border-radius:9px;padding:11px 13px;margin-top:-15px;margin-bottom:20px;font-size:11px;line-height:1.7;background:#fbf8fd}.guide dl{margin:0}.guide dt{font-weight:700;display:inline;color:var(--primary)}.guide dd{display:inline;margin:0}.guide dd::after{content:' ';display:block}.favorite{display:flex;align-items:center;border:1px solid var(--neutral-200);border-radius:12px;padding:14px 16px;gap:14px;cursor:pointer;margin:0 0 14px}.favorite .star{font-size:24px;color:#e38407;line-height:1}.favorite-copy{flex:1}.favorite b{display:block;font-size:12px;color:#2c233a;margin-bottom:6px}.favorite small{display:block;font-size:10px;color:#6d6483}.favorite input{width:20px;height:20px;accent-color:var(--primary);flex:none}.merge-help{color:#725778;font-size:11px;line-height:1.6;display:flex;align-items:flex-start;gap:7px;margin-bottom:2px}.merge-help strong{color:#8d198f}.invalid{border-color:var(--red)!important;box-shadow:0 0 0 2px #fdecec!important}.error-label{font-size:11px;color:var(--red);margin-top:6px;line-height:1.4}.inline-error{border:1px solid #f5c2c2;background:#fdecec;color:#8f2323;border-radius:8px;padding:12px 14px;font-size:12px;line-height:1.5;margin-bottom:18px}.btn{border-radius:8px;min-height:39px;padding:9px 17px;border:1px solid var(--primary);background:#fff;color:var(--primary);font-size:12px;font-weight:600;white-space:nowrap}.btn:hover{background:#faf3fb}.btn.primary{background:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-deep)}.btn.danger{background:#b91c1c;border-color:#b91c1c;color:white}.btn:disabled{opacity:.5}.btn svg{width:14px;height:14px;vertical-align:middle;margin-right:4px}.checktxt{font-size:11px;color:#686078}.toast{position:fixed;top:22px;right:20px;z-index:60;padding:13px 16px;display:flex;align-items:center;gap:10px;border:1px solid #b7e4c7;background:#e7f6ec;color:#176136;border-radius:10px;box-shadow:0 7px 30px #12051b36;font-size:12px;line-height:1.4}.toast.error-toast{border-color:#f5c2c2;background:#fdecec;color:#b91c1c}
/* Modal states replace content: no nesting of dialogs. */
.state{padding:45px 38px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;line-height:1.55}.state h2{font:700 23px var(--display);color:var(--primary);margin:2px 0 0}.state p{font-size:13px;max-width:480px;margin:0;color:#5d586a}.state .state-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:8px}.state .big-icon{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:#f0e3f0;color:var(--primary);font-size:32px}.state.success .big-icon{background:#e7f6ec;color:#15803d}.state.error .big-icon{background:#fdecec;color:#b91c1c}.spinner{border:4px solid #eee5f5;border-top-color:var(--primary);width:56px;height:56px;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{border:1px solid #e3e6f0;border-radius:12px;padding:16px;background:#fafbfe;min-height:103px}.metric.feature{border-color:#dbc1df;background:#f9f4fa}.metric small{display:block;color:#76617e;font-size:11px;margin-bottom:7px}.metric strong{font:700 25px var(--display);color:var(--primary)}.metric span{display:block;font-size:10px;color:#746983;margin-top:8px}.chart-shell{border:1px solid #e3e6f0;border-radius:12px;padding:16px;margin-top:18px}.chart-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.chart-top b{font-size:12px;color:#241631}.chart-top span{display:block;margin-top:5px;color:#86788e;font-size:10px}.tabs{display:flex;border-radius:8px;background:#f4f4fd;padding:3px}.tabs button{border:0;border-radius:6px;background:transparent;padding:9px 12px;font-size:11px;color:#726887}.tabs button.active{background:var(--primary);color:#fff}.chart-change{font-size:11px;margin-top:12px;color:#1688f8}.chart-shell svg{display:block;max-width:100%;height:auto;margin:10px 0 0}.chart-shell summary,.dashboard-accordion summary{font-size:11px;color:var(--primary);cursor:pointer;padding-top:8px}.chart-shell details p,.dashboard-accordion p{font-size:11px;color:#665a74;line-height:1.6}.dashboard-accordion{padding-top:18px;border-top:1px solid #e6e7f0;margin-top:15px}.subline{font-size:11px;color:#6d627e;margin:14px 0 10px}.subline b{display:block;color:#271c35;margin-top:5px;font-size:12px}.mock-note{font-size:11px;color:#74677d;margin-top:10px;line-height:1.4}
@media(max-width:900px){.hint{display:none}}@media(max-width:710px){.overlay{padding:8px}.modal{max-height:calc(100dvh - 16px);border-radius:12px}.modal-layout{grid-template-columns:1fr;gap:18px;padding:16px}.identity{display:grid;grid-template-columns:90px 1fr;gap:8px 12px}.identity .eyebrow{grid-column:1/-1;margin:0 0 2px}.card-image{grid-row:2/6;width:90px;height:124px;margin:0}.identity h2{align-self:end;margin:0}.identity .set{margin:0}.identity .rarity{justify-self:start;align-self:start}.facts{grid-column:1/-1;margin-top:3px;grid-template-columns:repeat(4,1fr)}.modal-head{padding:16px}.modal-head h1{font-size:18px}.modal-foot{padding:12px 16px}.modal-foot .footleft{display:none}.section-heading h3{font-size:16px}.demo-bar{bottom:8px;gap:4px;padding:7px}.demo-label{display:none}.demo-bar button{padding:8px;font-size:11px}.state{padding:37px 20px}}@media(max-width:400px){.field-grid{grid-template-columns:1fr;gap:0}.facts{grid-template-columns:1fr 1fr}.btn{padding:9px 11px;font-size:11px}.metric-grid{gap:7px}.metric{padding:12px}.metric strong{font-size:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

function iconInfo(){return '<span class="info-i" aria-hidden="true">i</span>'}
function identity(){return `<aside class="identity"><div class="eyebrow">${iconInfo()} Carta do catálogo · Somente leitura</div><img class="card-image" alt="Carta Pokémon Pikachu, Base Set, número 58/102" src="${CARD_IMAGE}"><h2>Pikachu</h2><div class="set">Base Set · Nº 58/102</div><div><span class="rarity">Common</span></div><div class="facts"><div><b>TCG</b><span>Pokémon</span></div><div><b>Coleção</b><span>Base Set</span></div><div><b>Número</b><span>58/102</span></div><div><b>Raridade</b><span>Common</span></div></div></aside>`}
function changeHead(title,subtitle){el('modalTitle').textContent=title;el('modalSubtitle').textContent=subtitle;el('closeBtn').hidden=working}
function foot(content){el('modalFooter').innerHTML=content}
function updateNav(){for(const x of ['add','edit','dashboard'])el('nav-'+x).classList.toggle('selected',flow===x&&!el('overlay').hidden);el('force-error').textContent=failNext?'⚠ Erro armado ✓':'⚠ Simular próximo erro'}
function setFailure(){failNext=!failNext;updateNav();announce(failNext?'O próximo salvamento simulará um erro.':'Simulação de erro desativada.',true)}
function announce(txt,isError=false){const t=el('toast');t.textContent=(isError?'⚠ ':'✓ ')+txt;t.classList.toggle('error-toast',isError);t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},4400)}
function openFlow(type){if(working)return;lastFocus=document.activeElement;flow=type;stage='form';pending=null;const picked=items.find(x=>x.id===activeItem)||items[0];if(type==='edit'&&!picked){announce('Adicione uma carta antes de editar.',true);return}original=type==='edit'?clone(picked):{quantity:1,condition:'NM',language:'pt-BR',notes:'',favorite:false};data=clone(original);el('overlay').hidden=false;document.body.style.overflow='hidden';render();updateNav();requestAnimationFrame(()=>{const x=el('closeBtn');if(x)x.focus({preventScroll:true})})}
function closeFlow(){if(el('overlay').hidden)return; if(working)return; requestClose()}
function dismiss(){el('overlay').hidden=true;document.body.style.overflow='';stage='form';working=false;updateNav();if(lastFocus&&document.contains(lastFocus))lastFocus.focus({preventScroll:true})}
function isDirty(){return flow!=='dashboard'&&data&&original&&JSON.stringify(data)!==JSON.stringify(original)}
function requestClose(){if(working)return;if(stage==='form'&&isDirty()){stage='discard';render()}else if(stage==='merge'){stage='form';render()}else dismiss()}
function handleBackdrop(e){if(e.target===el('overlay'))requestClose()}
function capture(){if(flow==='dashboard'||stage!=='form')return;const q=el('qty'),c=el('condition'),l=el('language'),n=el('notes'),f=el('fav');if(!q)return;data.quantity=q.value;data.condition=c.value;data.language=l.value;data.notes=n.value;data.favorite=f.checked;el('count').textContent=n.value.length;const bad=el('qtyError');bad.hidden=true;q.classList.remove('invalid')}
function setQty(n){let q=el('qty');let current=Number(q.value);if(!Number.isFinite(current))current=1;q.value=Math.min(999,Math.max(1,Math.trunc(current+n)));capture()}
function valid(){capture();let n=Number(data.quantity),q=el('qty'),qtyOk=data.quantity!==''&&Number.isInteger(n)&&n>0&&n<=999;let ok=qtyOk&&!!data.condition&&!!data.language&&data.notes.length<=300;if(!qtyOk){q.classList.add('invalid');el('qtyError').hidden=false;el('qtyError').textContent='Informe uma quantidade inteira entre 1 e 999.'}if(!data.condition)el('conditionError').hidden=false;if(!data.language)el('languageError').hidden=false;return ok}
function render(){const sc=el('modalBody');sc.scrollTop=0;updateNav();if(stage==='loading'){working=true;changeHead(flow==='add'?'Adicionar carta à coleção':'Editar item da coleção','Salvando informações dos seus exemplares.');sc.innerHTML=`<div class="state" role="status"><div class="spinner" aria-label="Carregando"></div><h2>Salvando sua coleção...</h2><p>Aguarde enquanto registramos os dados da sua posse.</p></div>`;foot('<span class="footleft">Operação simulada, sem API.</span>');return}
working=false;
if(stage==='discard'){changeHead('Descartar alterações?','Você possui dados ainda não salvos.');sc.innerHTML=`<div class="state"><div class="big-icon">!</div><h2>Descartar alterações?</h2><p>As informações alteradas neste formulário serão perdidas. Sua coleção permanecerá como estava.</p></div>`;foot('<button class="btn" onclick="stage=\'form\';render()">Continuar editando</button><button class="btn danger" onclick="dismiss()">Descartar alterações</button>');return}
if(stage==='merge'){let target=items.find(x=>x.id===pending.targetId),qty=Number(data.quantity);changeHead('Confirmar agrupamento','Já existe um agrupamento com esta condição e idioma.');sc.innerHTML=`<div class="state"><div class="big-icon">⇄</div><h2>Agrupar exemplares?</h2><p>Já existe um registro de <strong>Pikachu · ${CONDITION_NAMES[data.condition]} · ${LANGUAGE_NAMES[data.language]}</strong> com <strong>${target.quantity}</strong> exemplar(es).</p><p>Ao confirmar, o registro existente passará a ter <strong>${target.quantity+qty}</strong> exemplares e o agrupamento anterior será consolidado. O catálogo não será alterado.</p></div>`;foot('<button class="btn" onclick="stage=\'form\';render()">Voltar e revisar</button><button class="btn primary" onclick="commit()">Confirmar agrupamento</button>');return}
if(stage==='error'){changeHead('Não foi possível salvar','Ocorreu um problema ao atualizar sua coleção.');sc.innerHTML=`<div class="state error"><div class="big-icon">!</div><h2>Falha no salvamento</h2><p>Não foi possível concluir a operação. Nenhum dado foi alterado e os valores do formulário foram preservados.</p><div class="state-buttons"><button class="btn" onclick="stage=\'form\';render()">Revisar dados</button><button class="btn primary" onclick="trySaving()">Tentar novamente</button></div></div>`;foot('<span class="footleft">Falha de rede simulada. Seus dados permanecem disponíveis.</span>');return}
if(stage==='success'){changeHead(flow==='add'?'Carta adicionada à coleção':'Item atualizado com sucesso','Seus dados de posse foram atualizados.');sc.innerHTML=`<div class="state success"><div class="big-icon">✓</div><h2>${flow==='add'?'Carta adicionada!':'Alterações salvas!'}</h2><p>${pending?.summary||'Sua coleção foi atualizada.'} Os dados globais do catálogo permanecem iguais.</p><div class="state-buttons"><button class="btn" onclick="dismiss()">Voltar à coleção</button><button class="btn primary" onclick="openFlow('edit')">Editar agrupamento</button></div></div>`;foot('<span class="footleft">Estado de sucesso · protótipo sem API</span>');return}
if(flow==='dashboard'){renderDashboard();return}
renderForm()}
function renderForm(){const edit=flow==='edit';changeHead(edit?'Editar item da coleção':'Adicionar carta à coleção',edit?'Atualize as informações desta posse no seu acervo.':'Registre esta carta no seu acervo pessoal.');const condOptions=Object.entries(CONDITION_NAMES).map(([v,l])=>`<option value="${v}" ${data.condition===v?'selected':''}>${l}</option>`).join('');const langOptions=Object.entries(LANGUAGE_NAMES).map(([v,l])=>`<option value="${v}" ${data.language===v?'selected':''}>${l}</option>`).join('');el('modalBody').innerHTML=`<div class="modal-layout">${identity()}<div class="content-area"><div class="section-heading"><h3>Informações da sua coleção</h3><span class="label">Dados da posse</span></div><div class="info-box">${iconInfo()} <span>Você altera apenas <b>sua posse</b>. Os dados globais da carta no catálogo permanecem iguais.</span></div><div class="field-grid"><div class="field"><label for="qty">Quantidade <span class="req">*</span></label><div class="counter"><button type="button" aria-label="Diminuir quantidade" onclick="setQty(-1)">−</button><input type="number" id="qty" min="1" max="999" step="1" inputmode="numeric" value="${esc(data.quantity)}" oninput="capture()" aria-describedby="qtyHelp qtyError"><button type="button" aria-label="Aumentar quantidade" onclick="setQty(1)">＋</button></div><div class="help" id="qtyHelp">Quantidade total deste agrupamento.</div><div id="qtyError" class="error-label" role="alert" hidden></div></div><div class="field"><label for="condition">Condição <span class="req">*</span></label><select id="condition" onchange="capture()">${condOptions}</select><div class="error-label" id="conditionError" hidden>Selecione uma condição.</div></div></div><button type="button" class="help-link" id="guideToggle" onclick="toggleGuide()" aria-expanded="false">${iconInfo()} <span>Ver guia de condições</span></button><div class="guide" id="conditionGuide" hidden><dl><dt>NM — Near Mint:</dt><dd> Pouco ou nenhum sinal de desgaste.</dd><dt>LP — Lightly Played:</dt><dd> Pequenos sinais de uso.</dd><dt>MP — Moderately Played:</dt><dd> Desgaste moderado.</dd><dt>HP — Heavily Played:</dt><dd> Desgaste acentuado.</dd><dt>DMG — Damaged:</dt><dd> Danos relevantes na carta.</dd></dl></div><div class="field"><label for="language">Idioma <span class="req">*</span></label><select id="language" onchange="capture()">${langOptions}</select><div class="help">Idioma dos seus exemplares, não do cadastro global da carta.</div><div class="error-label" id="languageError" hidden>Selecione um idioma.</div></div><div class="field"><label for="notes">Observações <span style="font-weight:400">(opcional)</span></label><textarea id="notes" maxlength="300" placeholder="Ex.: Comprada em evento. Guardada em sleeve." oninput="capture()">${esc(data.notes)}</textarea><div class="charcount"><span id="count">${data.notes.length}</span>/300</div></div><label class="favorite"><span class="star">☆</span><span class="favorite-copy"><b>Marcar como favorito</b><small>Destaque este item na sua coleção.</small></span><input type="checkbox" id="fav" ${data.favorite?'checked':''} onchange="capture()"></label><p class="merge-help"><strong>⊞</strong> Mesma carta, condição e idioma? Os exemplares serão agrupados.</p></div></div>`;foot(`<span class="footleft">* Campos obrigatórios · Protótipo demonstrativo</span><button type="button" class="btn" onclick="requestClose()">Cancelar</button><button type="button" class="btn primary" onclick="trySaving()">${edit?'Salvar alterações':'Adicionar à minha coleção'}</button>`)}
function esc(str){return String(str??'').replace(/[&<>\"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))}
function toggleGuide(){const g=el('conditionGuide');g.hidden=!g.hidden;el('guideToggle').setAttribute('aria-expanded',String(!g.hidden));el('guideToggle').querySelector('span:last-child').textContent=g.hidden?'Ver guia de condições':'Ocultar guia de condições'}
function trySaving(){if(working)return;if(stage==='form'&&!valid())return;if(stage==='error'){stage='form';renderForm()}if(stage==='form'){capture();const keyMatch=items.find(x=>x.condition===data.condition&&x.language===data.language&&(flow==='add'||x.id!==activeItem));if(keyMatch){pending={targetId:keyMatch.id};stage='merge';render();return}}
commit()}
function commit(){if(working)return;const isEdit=flow==='edit';const snapshot=clone(data);const mergeTarget=pending?.targetId;stage='loading';render();window.setTimeout(()=>{working=false;if(el('overlay').hidden)return;if(failNext){failNext=false;stage='error';render();updateNav();return}const quantity=Number(snapshot.quantity);const target=items.find(x=>x.id===mergeTarget);if(target){target.quantity+=quantity;target.favorite=target.favorite||snapshot.favorite;target.notes=[target.notes,snapshot.notes].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).join(' | ').slice(0,300);if(isEdit)items=items.filter(x=>x.id!==activeItem);activeItem=target.id;pending={summary:`Agrupamento consolidado. Agora você possui ${target.quantity} exemplar(es) neste grupo.`}}else if(isEdit){const current=items.find(x=>x.id===activeItem);if(current)Object.assign(current,{quantity,condition:snapshot.condition,language:snapshot.language,notes:snapshot.notes,favorite:snapshot.favorite});pending={summary:`Você possui ${quantity} exemplar(es) neste agrupamento.`}}else{const newItem={...snapshot,id:nextId++,quantity};items.unshift(newItem);activeItem=newItem.id;pending={summary:`Você adicionou ${quantity} exemplar(es) à coleção.`}}stage='success';original=clone(data);render();announce(isEdit?'Alterações salvas com sucesso.':'Carta adicionada à coleção.')},850)}
function renderDashboard(){changeHead('Panorama da carta','Estatísticas e indicadores de mercado para a carta do catálogo.');el('modalBody').innerHTML=`<div class="modal-layout">${identity()}<div class="content-area"><div class="section-heading"><h3>Panorama da carta</h3><span class="label">Dados simulados</span></div><div class="info-box">${iconInfo()} <span>Valores fictícios para demonstrar a interface. Não representam cotações reais.</span></div><div class="subline">Base de comparação<b>Mesma impressão · NM · Português</b></div><div class="metric-grid"><div class="metric feature"><small>Preço médio anunciado</small><strong>R$ 41,00</strong><span>Por exemplar · sem frete</span></div><div class="metric"><small>Anúncios na amostra</small><strong>8</strong><span>Ofertas simuladas</span></div><div class="metric"><small>Menor preço</small><strong>R$ 31,98</strong><span>Na mesma base de comparação</span></div><div class="metric"><small>Maior preço</small><strong>R$ 50,43</strong><span>Na mesma base de comparação</span></div></div><div class="chart-shell"><div class="chart-top"><div><b>Evolução do preço médio</b><span>Histórico ilustrativo de preços anunciados</span></div><div class="tabs" role="group" aria-label="Período do gráfico"><button class="active" id="tab7" onclick="changeChart(7)" aria-pressed="true">7 dias</button><button id="tab30" onclick="changeChart(30)" aria-pressed="false">30 dias</button></div></div><div class="chart-change" id="chartChange">+6,4% na amostra de 7 dias</div><svg id="graph" viewBox="0 0 468 184" aria-label="Gráfico ilustrativo da evolução dos preços" role="img"></svg><details><summary>Ver valores do gráfico</summary><p id="chartValues"></p></details></div><details class="dashboard-accordion"><summary>Como interpretar os indicadores</summary><p>O preço médio representa a média aritmética dos valores anunciados na amostra. Não é uma promessa de venda. A comparação considera impressão, condição e idioma.</p></details></div></div>`;foot('<span class="footleft">Dados de mercado simulados · Somente leitura</span><button class="btn" onclick="dismiss()">Voltar à coleção</button><button class="btn primary" onclick="announce(\'O fluxo de anúncio será desenvolvido em tarefa própria.\')">＋ Criar anúncio</button>');changeChart(7)}
function changeChart(days){el('tab7').classList.toggle('active',days===7);el('tab30').classList.toggle('active',days===30);el('tab7').setAttribute('aria-pressed',String(days===7));el('tab30').setAttribute('aria-pressed',String(days===30));const series=days===7?[38.5,39.6,39.1,40.1,39.8,41.4,41]:[33.2,34,35,34.6,36.8,36.3,37,36.4,38.3,38.1,38.9,40.2,39.7,40.4,39.9,41];const lo=31,hi=44,w=405,x0=56,y0=14,h=127;const pts=series.map((v,i)=>[x0+i*w/(series.length-1),y0+(hi-v)/(hi-lo)*h]);const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');const fill=line+' L '+(x0+w)+','+(y0+h)+' L '+x0+','+(y0+h)+' Z';el('graph').innerHTML=`<defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#660366" stop-opacity=".20"/><stop offset="1" stop-color="#660366" stop-opacity="0"/></linearGradient></defs>${[14,77,141].map((y,i)=>`<line x1="56" y1="${y}" x2="461" y2="${y}" stroke="#e3e2ef" stroke-dasharray="4 5"/><text x="5" y="${y+4}" font-size="9" fill="#8d8596">R$ ${[44,37.5,31][i].toFixed(2).replace('.',',')}</text>`).join('')}<path d="${fill}" fill="url(#a)"/><path d="${line}" fill="none" stroke="#660366" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="3.5" fill="#660366" stroke="#fff" stroke-width="2"/><text x="56" y="168" font-size="10" fill="#8d8596">${days===7?'D−6':'D−29'}</text><text x="258" y="168" font-size="10" fill="#8d8596">${days===7?'D−3':'D−15'}</text><text x="414" y="168" font-size="10" fill="#8d8596">Hoje</text>`;el('chartChange').textContent=(days===7?'+6,4% na amostra de 7 dias':'+23,5% na amostra de 30 dias');el('chartValues').textContent=series.map((v,i)=>`D−${series.length-1-i}: R$ ${v.toFixed(2).replace('.',',')}`).join(' · ')}
// Trap Tab inside the single active dialog and provide Escape to close or confirm discard.
document.addEventListener('keydown',event=>{if(el('overlay').hidden)return;if(event.key==='Escape'){event.preventDefault();requestClose();return}if(event.key!=='Tab')return;const selectable=[...el('modal').querySelectorAll('button:not([disabled]):not([hidden]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),summary')].filter(x=>x.offsetParent!==null);if(!selectable.length)return;const first=selectable[0],last=selectable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}});
// Start on the add flow so the high-fidelity modal is immediately visible.
openFlow('add');
</script></body></html>
